steps:
      - name: Checkout repository
      enviroment: sdk: '^3.13.0'
        uses: actions/checkout@v4

      # 1. Configura el SDK de Flutter (Esto corrige el error)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Acelera las futuras ejecuciones guardando la caché

      # 2. Instala las dependencias con el comando correcto
      - name: Install dependencies
        run: flutter pub get

      # 3. Analiza el código del proyecto
      - name: Analyze project source
        run: flutter analyze

      # 4. Ejecuta las pruebas automatizadas
      - name: Run tests
        run: flutter test
