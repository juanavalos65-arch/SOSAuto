name: sos_auto
description: >-
  Aplicación móvil de asistencia vehicular y alertas de emergencia SOS 
  para conductores en carretera.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Dependencias clave para una app de SOS:
  geolocator: ^10.1.0      # Obtiene las coordenadas GPS del vehículo
  geocoding: ^3.0.0       # Traduce coordenadas a direcciones legibles
  flutter_sms: ^0.2.1     # Envía alertas automáticas por SMS
  url_launcher: ^6.2.5    # Permite llamar directamente a grúas o líneas de emergencia
  sensors_plus: ^5.0.1    # Detecta frenazos bruscos o impactos usando el acelerómetro

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/sos_button.png
    - assets/images/car_icon.png
